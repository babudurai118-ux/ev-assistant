<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E.V. Assistant — Brand New Day</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


// Then use the 'apiKey' variable when initializing your AI client
const ai = new GoogleGenAI({ apiKey: apiKey });


    body {
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #060709;
      color: #fff;
      font-family: 'Inter', sans-serif;
      padding-bottom: 80px;
    }

    .dashboard-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 14px;
      gap: 14px;
    }

    .header-ring {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(145deg, rgba(18, 19, 26, 0.9), rgba(10, 11, 15, 0.95));
      border: 1px solid rgba(255, 0, 60, 0.35);
      border-radius: 20px;
      position: relative;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 0, 60, 0.1);
      overflow: hidden;
    }

    .core-orb-container {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .core-orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff003c 0%, #4a0015 65%, #060709 100%);
      box-shadow: 0 0 25px rgba(255, 0, 60, 0.6);
      transition: transform 0.3s ease;
      z-index: 2;
    }

    .core-orb-container.thinking .core-orb {
      animation: orbPulse 1.2s infinite ease-in-out;
    }

    .orb-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px dashed rgba(255, 0, 60, 0.4);
      border-radius: 50%;
      animation: spinRing 10s linear infinite;
    }

    .core-orb-container.thinking .orb-ring {
      border-color: #ff003c;
      animation: spinRing 2s linear infinite, glowRing 1.2s infinite alternate;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes orbPulse {
      0% { transform: scale(0.95); box-shadow: 0 0 15px rgba(255, 0, 60, 0.5); }
      50% { transform: scale(1.1); box-shadow: 0 0 35px rgba(255, 0, 60, 0.9); }
      100% { transform: scale(0.95); box-shadow: 0 0 15px rgba(255, 0, 60, 0.5); }
    }

    @keyframes glowRing {
      0% { box-shadow: 0 0 5px rgba(255,0,60,0.2); }
      100% { box-shadow: 0 0 20px rgba(255,0,60,0.8); }
    }

    .status-indicators {
      display: flex;
      gap: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: #666;
    }

    .status-indicators span {
      transition: color 0.3s, text-shadow 0.3s;
    }

    .status-indicators span.on {
      color: #ff003c;
      text-shadow: 0 0 10px rgba(255, 0, 60, 0.8);
    }

    .chat-container {
      background: rgba(18, 19, 26, 0.85);
      border: 1px solid rgba(255, 0, 60, 0.25);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .chat-messages {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 6px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 0, 60, 0.3);
      border-radius: 4px;
    }

    .message {
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      background: linear-gradient(135deg, rgba(255, 0, 60, 0.2), rgba(255, 0, 60, 0.1));
      border: 1px solid rgba(255, 0, 60, 0.4);
      align-self: flex-end;
      max-width: 85%;
      border-bottom-right-radius: 2px;
    }

    .message.ev {
      background: rgba(26, 28, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      align-self: flex-start;
      max-width: 85%;
      border-bottom-left-radius: 2px;
    }

    .message.typing-indicator span {
      display: inline-block;
      animation: blinkDots 1.4s infinite steps(4, end);
    }

    @keyframes blinkDots {
      0% { content: '.'; }
      33% { content: '. .'; }
      66% { content: '. . .'; }
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      background: #0d0e13;
      border: 1px solid rgba(255, 0, 60, 0.3);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-row input:focus {
      border-color: #ff003c;
      box-shadow: 0 0 10px rgba(255, 0, 60, 0.25);
    }

    .action-btn {
      background: linear-gradient(135deg, #ff003c, #cc0030);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    .mic-btn {
      background: rgba(26, 28, 38, 0.9);
      border: 1px solid rgba(255, 0, 60, 0.4);
      border-radius: 10px;
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .mic-btn.active {
      background: #00ff66 !important;
      border-color: #00ff66;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
      animation: micPulse 1s infinite alternate;
    }

    @keyframes micPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .widget-row {
      display: flex;
      gap: 10px;
    }

    .card {
      flex: 1;
      background: rgba(18, 19, 26, 0.85);
      border: 1px solid rgba(255, 0, 60, 0.2);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .card h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      color: #ff003c;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .card .value {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 600;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .quick-btn {
      background: rgba(26, 28, 38, 0.7);
      border: 1px solid rgba(255, 0, 60, 0.2);
      border-radius: 10px;
      padding: 12px 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:active {
      background: rgba(255, 0, 60, 0.2);
      border-color: #ff003c;
      transform: scale(0.97);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(10, 11, 15, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 1000;
      backdrop-filter: blur(15px);
    }

    .nav-item {
      color: #777;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-item.active {
      color: #ff003c;
      text-shadow: 0 0 8px rgba(255,0,60,0.5);
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="header-ring">
      <div class="core-orb-container" id="orbContainer" onclick="toggleMicrophone()" title="Tap to toggle voice recognition">
        <div class="orb-ring"></div>
        <div class="core-orb"></div>
      </div>
      <div class="status-indicators">
        <span id="stListening">LISTEN</span> • 
        <span id="stThinking">THINK</span> • 
        <span id="stProcessing">PROCESS</span> • 
        <span id="stReady" class="on">READY</span>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="message ev"><strong>E.V.:</strong> Systems online, Durai. Brand New Day interface initialized. Ready for your command.</div>
      </div>
      <div class="input-row">
        <input type="text" id="textInput" placeholder="Ask E.V. anything..." onkeydown="if(event.key==='Enter') sendToEV(this.value)">
        <button class="action-btn" onclick="sendToEV(document.getElementById('textInput').value)">Send</button>
        <button class="mic-btn" id="micBtn" onclick="toggleMicrophone()">🎙️</button>
      </div>
    </div>

    <div class="widget-row">
      <div class="card">
        <h3>Weather • Chennai</h3>
        <div class="value">28°C</div>
        <div style="font-size:11px; color:#888; margin-top:4px;">Clear Skies</div>
      </div>
      <div class="card">
        <h3>EV Status</h3>
        <div class="value battery-value">--%</div>
        <div class="ev-status-text" style="font-size:11px; color:#888; margin-top:4px;">Checking...</div>
      </div>
    </div>

    <div class="card">
      <h3>Quick Actions</h3>
      <div class="quick-grid" style="margin-top: 8px;">
        <div class="quick-btn" onclick="sendToEV('Open maps and navigate')">🗺️ Navigate</div>
        <div class="quick-btn" onclick="sendToEV('Play a song on YouTube')">▶️ YouTube</div>
        <div class="quick-btn" onclick="sendToEV('Check my device status')">⚡ System Info</div>
        <div class="quick-btn" onclick="sendToEV('Tell me a quick tech fact')">💡 Tech Fact</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active">HOME</div>
    <div class="nav-item" onclick="sendToEV('Give me a status summary.')">ASSISTANT</div>
    <div class="nav-item" onclick="window.open('https://maps.google.com', '_blank')">MAPS</div>
    <div class="nav-item" onclick="window.open('https://www.youtube.com', '_blank')">YOUTUBE</div>
    <div class="nav-item" onclick="alert('E.V. v1.2 • Brand New Day Edition')">SETTINGS</div>
  </div>

  <script>
    let history = [];
  // Put this at the top of your main script where initialization happens
let apiKey = localStorage.getItem('gemini_api_key');
if (!apiKey) {
    apiKey = prompt("Enter your Gemini API Key:");
    if (apiKey) {
        localStorage.setItem('gemini_api_key', apiKey.trim());
    }
}

// Then use the 'apiKey' variable when initializing your AI client
const ai = new GoogleGenAI({ apiKey: apiKey });

';

    async function addMessageAnimated(sender, text) {
      const chatMessages = document.getElementById('chatMessages');
      if (!chatMessages) return;
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      chatMessages.appendChild(msgDiv);

      if (sender === 'ev') {
        msgDiv.innerHTML = `<strong>E.V.:</strong> <span></span>`;
        const span = msgDiv.querySelector('span');
        let i = 0;
        while (i < text.length) {
          span.textContent += text.charAt(i);
          i++;
          chatMessages.scrollTop = chatMessages.scrollHeight;
          await new Promise(r => setTimeout(r, 12));
        }
      } else {
        msgDiv.innerHTML = `<strong>Durai:</strong> ${text}`;
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendToEV(message) {
      if (!message || !message.trim()) return;
      
      const chatMessages = document.getElementById('chatMessages');
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.innerHTML = `<strong>Durai:</strong> ${message}`;
      chatMessages.appendChild(userDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const textInput = document.getElementById('textInput');
      if (textInput) textInput.value = '';

      const stThinking = document.getElementById('stThinking');
      const stProcessing = document.getElementById('stProcessing');
      const stReady = document.getElementById('stReady');
      const orbContainer = document.getElementById('orbContainer');

      if(stReady) stReady.classList.remove('on');
      if(stThinking) stThinking.classList.add('on');
      if(orbContainer) orbContainer.classList.add('thinking');

      // Add waiting typing indicator bubble
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message ev typing-indicator';
      typingDiv.id = 'typingIndicator';
      typingDiv.innerHTML = `<strong>E.V.:</strong> <span>Processing request . . .</span>`;
      chatMessages.appendChild(typingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

        const contents = history.map(h => ({
          role: h.role === 'model' ? 'model' : 'user',
          parts: h.parts
        }));
        contents.push({ role: 'user', parts: [{ text: message }] });

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: "You are E.V., an advanced personal AI assistant styled under the Spider-Man Brand New Day universe for Durai, living in Chennai, India, studying in the 12th grade. Keep your tone sharp, helpful, friendly, and resourceful. If the user asks to open an app, navigate, or check something, keep your text reply brief and execute the action." }]
            },
            contents: contents
          })
        });

        const data = await res.json();
        
        // Remove typing indicator bubble
        document.getElementById('typingIndicator')?.remove();

        if(stThinking) stThinking.classList.remove('on');
        if(orbContainer) orbContainer.classList.remove('thinking');
        if(stProcessing) stProcessing.classList.add('on');

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          await addMessageAnimated('ev', reply);
          history.push({ role: 'user', parts: [{ text: message }] });
          history.push({ role: 'model', parts: [{ text: reply }] });

          // Mobile Control Triggers with proper YouTube priority handling
          const lowerMsg = message.toLowerCase();
          if (lowerMsg.includes('navigate') || lowerMsg.includes('map') || lowerMsg.includes('directions')) {
            window.open('https://maps.google.com', '_blank');
          } else if (lowerMsg.includes('youtube') || lowerMsg.includes('yt')) {
            const query = message.replace(/play|on|to|youtube|yt|search/gi, '').trim();
            if (query) {
              window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
            } else {
              window.open('https://www.youtube.com', '_blank');
            }
          } else if (lowerMsg.includes('call')) {
            window.location.href = 'tel:';
          } else if (lowerMsg.includes('spotify') || (lowerMsg.includes('music') && !lowerMsg.includes('youtube'))) {
            window.open('https://open.spotify.com', '_blank');
          }
          if (navigator.vibrate) navigator.vibrate(50);
        } else {
          await addMessageAnimated('ev', "Error: " + (data.error?.message || "System anomaly detected."));
        }
      } catch (err) {
        document.getElementById('typingIndicator')?.remove();
        if(stThinking) stThinking.classList.remove('on');
        if(orbContainer) orbContainer.classList.remove('thinking');
        await addMessageAnimated('ev', "Connection error: " + err.message);
      }
      setTimeout(() => {
        if(stProcessing) stProcessing.classList.remove('on');
        if(stReady) stReady.classList.add('on');
      }, 600);
    }

    async function initBattery() {
      if ('getBattery' in navigator) {
        const battery = await navigator.getBattery();
        const updateBatteryUI = () => {
          const level = Math.round(battery.level * 100);
          const charging = battery.charging;
          document.querySelectorAll('.battery-value').forEach(el => el.textContent = level + '%');
          const statusEl = document.querySelector('.ev-status-text');
          if (statusEl) statusEl.textContent = charging ? 'Charging' : 'Not Charging';
        };
        updateBatteryUI();
        battery.addEventListener('levelchange', updateBatteryUI);
        battery.addEventListener('chargingchange', updateBatteryUI);
      } else {
        document.querySelectorAll('.battery-value').forEach(el => el.textContent = '100%');
        const statusEl = document.querySelector('.ev-status-text');
        if (statusEl) statusEl.textContent = 'Ready';
      }
    }
    window.addEventListener('DOMContentLoaded', initBattery);

    let recognition = null;
    let isListening = false;

    function toggleMicrophone() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        alert("Speech Recognition is not supported directly here. Please use Spck Editor's live preview tab or an active local server view.");
        return;
      }

      if (isListening) {
        if (recognition) {
          try { recognition.stop(); } catch(e) {}
        }
        isListening = false;
        document.getElementById('micBtn')?.classList.remove('active');
        document.getElementById('stListening')?.classList.remove('on');
        return;
      }

      try {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
          isListening = true;
          document.getElementById('micBtn')?.classList.add('active');
          document.getElementById('stListening')?.classList.add('on');
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          const inputField = document.getElementById('textInput');
          if (inputField) inputField.value = transcript;
          sendToEV(transcript);
        };

        recognition.onerror = (event) => {
          console.warn("Speech error:", event.error);
          isListening = false;
          document.getElementById('micBtn')?.classList.remove('active');
          document.getElementById('stListening')?.classList.remove('on');
        };

        recognition.onend = () => {
          isListening = false;
          document.getElementById('micBtn')?.classList.remove('active');
          document.getElementById('stListening')?.classList.remove('on');
        };

        recognition.start();
      } catch (err) {
        isListening = false;
        document.getElementById('micBtn')?.classList.remove('active');
        document.getElementById('stListening')?.classList.remove('on');
        alert("Microphone execution requires running inside Spck Editor's preview tab or a web server context.");
      }
    }
  </script>
</body>
</html>
